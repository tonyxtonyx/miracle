[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miracle"
version = "0.1.0"
description = "Reproducible SWE-bench Verified experiment infrastructure, decoupled from the agent runtime."
requires-python = ">=3.10"
dependencies = [
    "swebench==5.0.2",   # official harness, pinned: results are only comparable within one harness version
    "datasets",
    "huggingface_hub",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
miracle = "miracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs Docker and network; run with `pytest -m docker`"]
addopts = "-m 'not docker'"
